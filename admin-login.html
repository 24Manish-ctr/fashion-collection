<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Fashion Collection</title>

<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-container">

    <h2>Admin Login</h2>
    
    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Enter Admin Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <a href="#" class="forgot">
        Forgot Password?
    </a>

    <p id="errorMsg"></p>

</div>

<script src="js/login.js"></script>

</body>
</html>
